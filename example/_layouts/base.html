<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · FastComments Jekyll</title>
  <style>
    :root { --brand: #6750ff; --ink: #14121f; --muted: #5b5870; --line: #e7e5f0; --bg: #faf9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: var(--ink); background: var(--bg); line-height: 1.55; }
    .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .rail { border-right: 1px solid var(--line); padding: 24px; background: #fff; }
    .brand { font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; display: block; margin-bottom: 4px; }
    .brand span { color: var(--brand); }
    .rail .tag { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .nav a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--ink);
             text-decoration: none; font-size: 15px; }
    .nav a:hover { background: var(--bg); }
    .nav a.active { background: var(--brand); color: #fff; }
    .nav .group { color: var(--muted); font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
    main { padding: 40px 48px; max-width: 880px; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 17px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
    pre { background: #14121f; color: #efeefc; padding: 16px; border-radius: 10px; overflow:auto; font-size: 14px; }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="{{ '/' | relative_url }}">Fast<span>Comments</span></a>
      <div class="tag">Jekyll showcase · tenant demo</div>
      <nav class="nav">
        <div class="group">Widgets</div>
        {% assign items = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
        {% for item in items %}
          <a href="{{ item.url | relative_url }}" class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </aside>
    <main>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
      {{ content }}
    </main>
  </div>
</body>
</html>
